name: stayhub
services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
  test-db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    profiles: [test]
    environment:
      POSTGRES_USER: stayhub_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stayhub_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U stayhub_test -d stayhub_test]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: rustfs/rustfs:1.0.3-glibc@sha256:98d08d6654102cb253ef8d7c31dec18cbd470b97aca5d851c7abff40b1d14f1d
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: ['/data']
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - object_data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    volumes:
      - ./demo:/demo-content:ro
    env_file: .env
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://stayhub_test:${POSTGRES_PASSWORD}@test-db:5432/stayhub_test
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      storage:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  expiry-worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: [uv, run, --frozen, python, -m, app.sweep, --loop, --interval, '60', --batch-size, '100']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      api:
        condition: service_healthy
volumes:
  object_data:
  postgres_data:
