[project]
name = "stayhub-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "boto3==1.43.122",
    "pillow==13.0.0",
]
[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "boto3-stubs[s3]==1.43.122",
]
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
