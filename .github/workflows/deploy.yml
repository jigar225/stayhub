name: Check and deploy StayHub sandbox
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stayhub-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: stayhub_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: stayhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stayhub_test -d stayhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_S3_BUCKET: stayhub-ci-test
      S3_BUCKET: stayhub-ci-development
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-storage-key
      S3_SECRET_KEY: ci-storage-secret-123456
      DATABASE_URL: postgresql+psycopg://stayhub_test:ci-test-password@localhost:5432/stayhub_test
      TEST_DATABASE_URL: postgresql+psycopg://stayhub_test:ci-test-password@localhost:5432/stayhub_test
      JWT_SECRET: ci-only-secret-never-used-in-deployment-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.13'
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint && npm --prefix frontend run typecheck && npm --prefix frontend test && npm --prefix frontend run build
      - run: uv sync --frozen --project backend
      - run: backend/.venv/bin/python infra/tests/test_storage_credentials.py
      - run: backend/.venv/bin/python infra/tests/test_deployment.py
      - run: uv run --frozen ruff check . && uv run --frozen mypy app tests
        working-directory: backend
      - name: Start isolated test storage
        run: |
          docker run -d --name stayhub-ci-storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=ci-storage-key \
            -e RUSTFS_SECRET_KEY=ci-storage-secret-123456 \
            -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.3-glibc /data
      - name: Wait for local test storage
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:9000/health/ready && exit 0
            sleep 2
          done
          exit 1
      - run: uv run --frozen pytest
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist/
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      REGISTRY: 762079300828.dkr.ecr.us-east-1.amazonaws.com
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: release/frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '762079300828'
      - run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build immutable backend image
        shell: bash
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name jigar-stayhub/backend --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>image-error.log; then
            echo "Reusing immutable image for this commit"
          elif grep -q ImageNotFoundException image-error.log; then
            docker build -t "$REGISTRY/jigar-stayhub/backend:$GITHUB_SHA" backend
            docker push "$REGISTRY/jigar-stayhub/backend:$GITHUB_SHA"
          else
            cat image-error.log
            exit 1
          fi
      - name: Upload release and deploy
        shell: bash
        run: |
          set -euo pipefail
          digest=$(python3 infra/deploy/package.py --frontend release/frontend --output release.tar.gz)
          aws s3 cp release.tar.gz "s3://$RELEASE_BUCKET/releases/$GITHUB_SHA/$digest.tar.gz"
          command_id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name "$DEPLOY_DOCUMENT" --parameters "Release=$GITHUB_SHA,Sha256=$digest" --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Deployment wait timed out; inspect SSM command $command_id before retrying."
          exit 1
